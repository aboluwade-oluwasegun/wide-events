name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run ci

  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack internal
        run: npm pack --dry-run
        working-directory: packages/internal

      - name: Pack collector
        run: npm pack --dry-run
        working-directory: packages/collector

      - name: Pack sdk
        run: npm pack --dry-run
        working-directory: packages/sdk

      - name: Pack client
        run: npm pack --dry-run
        working-directory: packages/client

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build collector image
        run: docker build -f packages/collector/Dockerfile -t wide-events-collector:ci .

      - name: Smoke test collector health endpoint
        run: |
          cid=$(docker run -d \
            -e WIDE_EVENTS_DUCKDB_PATH=/tmp/wide-events.db \
            wide-events-collector:ci)
          trap 'docker rm -f "$cid"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$cid" curl -fsS http://127.0.0.1:4318/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
